<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies</title>
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="find.css">
<link rel="stylesheet" href="companies.css">
</head>
<body>
<header class="cb-nav">
  <div class="cb-nav-row">
    <a class="cb-brand" href="/">Cohort Job Board</a>
    <nav class="cb-tabs" aria-label="Sections">
      <a href="/" data-tab="find">Find a job</a>
      <a href="/map" data-tab="map">Map</a>
      <a href="/companies" data-tab="companies" aria-current="page">Companies</a>
      <a href="/cohort" data-tab="cohort">Cohort</a>
    </nav>
    <a class="cb-upload" href="/companies?view=upload" title="Add a LinkedIn export (the upload page links to LinkedIn's data request)">Upload your data</a>
    <span class="cb-private">Private: this computer only</span>
    <button class="cb-logout" type="button">Log out</button>
  </div>
</header>

<main class="wrap layout">
  <section class="results" id="dirList" aria-label="Companies">
    <div class="banner" id="banner" hidden></div>
    <div class="results-head">
      <div>
        <h1 id="count">Companies</h1>
        <p class="muted tiny dir-sub">Classmates who work or worked there come first, then most connections.</p>
      </div>
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-show="all">All</button>
        <button type="button" data-show="ties">Cohort ties</button>
        <button type="button" data-show="jobs">Open roles</button>
      </div>
    </div>
    <div class="dir-search">
      <input id="q" type="search" placeholder="Search companies, descriptions, cities…" aria-label="Search companies">
    </div>
    <div class="chips dir-verticals" id="verticals" role="group" aria-label="Vertical"></div>
    <div class="hidden-bar" id="regionBar" hidden></div>
    <div id="list"></div>
    <button class="btn more" id="more" type="button" hidden>Show more</button>
  </section>
  <section class="results co-detail" id="detail" aria-label="Company" hidden></section>
</main>
<script src="globalbar.js"></script>
<script src="companygraph.js"></script>
<script src="companies.js"></script>
</body>
</html>
