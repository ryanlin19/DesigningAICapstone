<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a Job</title>
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="find.css">
</head>
<body>
<header class="cb-nav">
  <div class="cb-nav-row">
    <a class="cb-brand" href="/">Cohort Job Board</a>
    <nav class="cb-tabs" aria-label="Sections">
      <a href="/" data-tab="find" aria-current="page">Find a job</a>
      <a href="/map" data-tab="map">Map</a>
      <a href="/companies" data-tab="companies">Companies</a>
      <a href="/companies?view=bridges" data-tab="cohort">Cohort</a>
    </nav>
    <span class="cb-private">Private: this computer only</span>
    <button class="cb-logout" type="button">Log out</button>
  </div>
</header>

<main class="wrap layout">
  <section class="results" aria-label="Jobs">
    <div class="banner" id="banner" hidden></div>
    <div class="results-head">
      <h1 id="count">Jobs</h1>
      <div class="seg" role="group" aria-label="Sort jobs">
        <button type="button" data-sort="fit">Best fit</button>
        <button type="button" data-sort="newest">Newest</button>
      </div>
    </div>
    <div class="hidden-bar" id="companyBar" hidden></div>
    <div class="hidden-bar" id="hiddenBar" hidden></div>
    <section class="tl" id="timeline" aria-label="When these jobs were posted"></section>
    <div id="list"></div>
    <button class="btn more" id="more" type="button" hidden>Show more</button>
  </section>
</main>
<script src="describe.js"></script>
<script src="globalbar.js"></script>
<script src="find.js"></script>
</body>
</html>
